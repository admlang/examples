<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#f5a623">
        <animate attributeName="stop-color" values="#f5a623;#f26b38;#f5a623" dur="4s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    <path id="orbit" d="M 140 160 A 100 60 0 1 1 340 160 A 100 60 0 1 1 140 160 Z"/>
  </defs>

  <rect width="480" height="320" fill="#141a2e"/>

  <!-- The orbit, its dashes running along it. -->
  <use href="#orbit" fill="none" stroke="#3d4a75" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  </use>

  <!-- The sun breathes. -->
  <circle cx="240" cy="160" r="34" fill="url(#sun)">
    <animate attributeName="r" values="34;40;34" keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- A planet follows the orbit, turned along it, with a moon around it. -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit"/>
    </animateMotion>
    <circle r="12" fill="#4fc3f7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <circle cx="22" r="4" fill="#e0e0e0"/>
    </g>
  </g>

  <!-- A gear turning in steps: teeth are the dashes of a thick ring. -->
  <g transform="translate(60 60)" fill="#8e9bd6">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;15;30;45;60;75" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#8e9bd6" stroke-width="10" stroke-dasharray="5.76 5.76"/>
      <circle r="19"/>
      <circle r="6" fill="#141a2e"/>
    </g>
  </g>

  <!-- A shape morphing between a square and a star. -->
  <path fill="#e57373" transform="translate(420 260)">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0;0.5;1" keySplines="0.5 0 0.5 1;0.5 0 0.5 1"
             values="M -24 -24 L 0 -24 L 24 -24 L 24 0 L 24 24 L 0 24 L -24 24 L -24 0 Z;
                     M -18 -18 L 0 -34 L 18 -18 L 34 0 L 18 18 L 0 34 L -18 18 L -34 0 Z;
                     M -24 -24 L 0 -24 L 24 -24 L 24 0 L 24 24 L 0 24 L -24 24 L -24 0 Z"/>
  </path>

  <!-- A comet that crosses once, then a flash when it has gone. -->
  <circle id="comet" cx="-20" cy="40" r="5" fill="#fff">
    <animate id="cross" attributeName="cx" from="-20" to="500" begin="1s" dur="2.5s" fill="freeze"/>
    <animate attributeName="cy" from="40" to="120" begin="1s" dur="2.5s" fill="freeze"/>
  </circle>
  <rect width="480" height="320" fill="#fff" opacity="0">
    <set attributeName="opacity" to="0.15" begin="cross.end" dur="0.2s"/>
  </rect>
</svg>
